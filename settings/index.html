<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <script src="settings.js"></script>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                font-family: sans-serif;
            }

            form {
                margin: 15px 5px;
                > fieldset {
                    margin: 0;
                    padding: 0;
                    display: grid;
                    grid-template-columns: 70% 30%;
                    border: none;
                }

                > button {
                    display: block;
                    margin: 20px auto;
                    padding: 10px;
                    width: 50%;
                    background: #3B5998;
                    border: 1px solid  #23355B;
                    border-radius: 5px;
                    color: white;
                    cursor: pointer;
                    transition: 250ms background;
                    font-weight: bold;

                    &:hover {
                        background:  #758AB6;
                    }
                }
            }

            @media (prefers-color-scheme: dark) {
                body {
                    background: #252428;
                    color: #f2f0f8;
                }
            }
        </style>
    </head>
    <body>
        <form>
            <fieldset>
                <label for="minNbTabs" id="label-minNbTabs">Switch to vertical tabs when number of tabs exceeds:</label>
                <input type="number" min="2" id="minNbTabs" name="minNbTabs" />
            </fieldset>

            <button id="save-settings">Apply</button>
        </form>
    </body>
</html>
